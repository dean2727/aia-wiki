name: Nightly Wiki Update

on:
  # schedule:
  #   - cron: '0 2 * * *'   # 2am UTC every night
  workflow_dispatch:        # allow manual trigger

jobs:
  update-wiki:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout wiki (public)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout private repo
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.PRIVATE_REPO_NAME }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --locked

      - name: Fetch RSS feeds
        run: |
          echo "::group::RSS Ingestion"
          trap 'echo "::endgroup::"' EXIT
          uv run python pipeline/scripts/ingest_rss.py
        env:
          PRIVATE_REPO_PATH: private

      - name: Fetch Notion updates
        run: |
          echo "::group::Notion Ingestion"
          trap 'echo "::endgroup::"' EXIT
          uv run python pipeline/scripts/ingest_notion.py
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_ROOT_PAGE_ID: ${{ secrets.NOTION_ROOT_PAGE_ID }}
          PRIVATE_REPO_PATH: private

      # TODO: We implement a new fetch, then test locally, then enable it in workflow (with PR review)
      # - name: Fetch YouTube transcripts
      #   run: uv run python pipeline/scripts/ingest_youtube.py
      #   env:
      #     PRIVATE_REPO_PATH: private

      # - name: Process URL queue
      #   run: uv run python pipeline/scripts/ingest_queue.py
      #   env:
      #     PRIVATE_REPO_PATH: private

      - name: Record pre-run commit
        id: before
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Run Claude Code — triage and update wiki
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Important: Need the allowedTools arg; claude-code-action severely limits
          # or entirely disables arbitrary shell execution. Automated code review
          # plugins that invoke the GitHub CLI (gh api, gh pr diff) will be
          # consistently denied if not explicitly allowed
          claude_args: |
            --max-turns 30
            --model claude-opus-4-8
            --effort low
            --verbose
            --allowedTools "Read,Write,Edit,Glob,Grep,WebSearch"
          prompt: |
            Perform the nightly wiki update for aia-wiki.

            1. Read private/profile/Dean-Profile.md to load Dean's user model.
            2. Read all files in private/sources/staging/ — these are today's ingested sources.
            3. Split sources by type:
               - **Notion** (`source: notion` / `type: notion`): follow "Notion learning deltas" in CLAUDE.md.
                 Process bullet clusters (Track A: enrich existing wiki pages; Track B: selective WebSearch
                 for frontier pointers, max 3 searches per Notion file). Do NOT apply RSS-style whole-file triage.
               - **All other sources**: Triage using the signal threshold in CLAUDE.md. Score each 1–10.
                 For each source scoring 7 or above, create or update wiki pages.
            4. For all wiki writes:
               - Place pages in `wiki/technical/` or `wiki/world/` as appropriate (update `wiki/overview.md` only when it materially changes)
               - Do NOT add a Dean-Relevance section to public wiki pages (see CLAUDE.md)
            5. Update CHANGELOG.md with a dated entry listing created, updated, and skipped items
               (include a **Skipped — Notion** section when applicable).
            6. Do NOT regenerate INDEX.md — that runs weekly.
            7. Do NOT touch any files in private/ — read only (including relevance files).
            8. Do NOT run git commands — a later workflow step opens a PR with your file edits.

            For this GitHub Actions run, skip the private Dean-Relevance updates even though CLAUDE.md normally asks for them.
            Only edit files under wiki/ and CHANGELOG.md.

            Follow all guidelines in CLAUDE.md exactly.

      # Direct push to main (re-enable when ready to auto-merge nightly runs)
      # - name: Commit and push wiki changes
      #   id: commit
      #   run: |
      #     git config user.name "github-actions[bot]"
      #     git config user.email "github-actions[bot]@users.noreply.github.com"
      #     git add wiki/ CHANGELOG.md
      #     BEFORE_SHA="${{ steps.before.outputs.sha }}"
      #     if ! git diff --staged --quiet; then
      #       git commit -m "Nightly wiki update $(date -u +%F)"
      #     fi
      #     if [ "$(git rev-parse HEAD)" != "$BEFORE_SHA" ]; then
      #       git push
      #       echo "committed=true" >> "$GITHUB_OUTPUT"
      #     else
      #       echo "committed=false" >> "$GITHUB_OUTPUT"
      #       echo "No wiki changes to commit"
      #     fi

      - name: Open PR with wiki changes
        id: commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add wiki/ CHANGELOG.md
          if git diff --staged --quiet; then
            echo "committed=false" >> "$GITHUB_OUTPUT"
            echo "No wiki changes to commit"
            exit 0
          fi
          BRANCH="nightly/$(date -u +%F)-${{ github.run_id }}"
          git checkout -b "$BRANCH"
          git commit -m "Nightly wiki update $(date -u +%F)"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git push -u origin "$BRANCH"
          PR_URL=$(gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Nightly wiki update $(date -u +%F)" \
            --body "Automated nightly wiki update. Review and merge when ready.")
          echo "committed=true" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
          echo "Opened PR: $PR_URL"

      - name: Write run summary
        if: always()
        run: |
          echo "## Nightly Wiki Run — $(date '+%Y-%m-%d')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Ingestion" >> $GITHUB_STEP_SUMMARY
          cat private/sources/staging/.run-summary >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "No summary written" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Wiki Changes" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.commit.outputs.committed }}" = "true" ]; then
            echo "Branch: \`${{ steps.commit.outputs.branch }}\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "PR: ${{ steps.commit.outputs.pr_url }}" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            git diff --name-only "${{ steps.before.outputs.sha }}" HEAD >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "No PR opened (nothing scored high enough, or no file edits)." >> $GITHUB_STEP_SUMMARY
          fi
