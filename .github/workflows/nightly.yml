name: Nightly Wiki Update

on:
  # schedule:
  #   - cron: '0 2 * * *'   # 2am UTC every night
  workflow_dispatch:        # allow manual trigger

jobs:
  update-wiki:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout wiki (public)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout private repo
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.PRIVATE_REPO_NAME }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --locked

      - name: Fetch RSS feeds
        run: |
          echo "::group::RSS Ingestion"
          trap 'echo "::endgroup::"' EXIT
          uv run python pipeline/scripts/ingest_rss.py
        env:
          PRIVATE_REPO_PATH: private

      # TODO: We implement a new fetch, then test locally, then enable it in workflow (with PR review)
      # - name: Fetch YouTube transcripts
      #   run: uv run python pipeline/scripts/ingest_youtube.py
      #   env:
      #     PRIVATE_REPO_PATH: private

      # - name: Fetch Notion personal notes
      #   run: uv run python pipeline/scripts/ingest_notion.py
      #   env:
      #     NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
      #     NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
      #     PRIVATE_REPO_PATH: private

      # - name: Process URL queue
      #   run: uv run python pipeline/scripts/ingest_queue.py
      #   env:
      #     PRIVATE_REPO_PATH: private

      - name: Record pre-run commit
        id: before
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Run Claude Code — triage and update wiki
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --max-turns 30
            --model claude-sonnet-4-6
            --verbose
          prompt: |
            Perform the nightly wiki update for aia-wiki.

            1. Read private/profile/Dean-Profile.md to load Dean's user model.
            2. Read all files in private/sources/staging/ — these are today's ingested sources.
            3. Triage each source using the signal threshold in CLAUDE.md. Score each 1–10.
            4. For each source scoring 7 or above:
               - Create a new wiki page OR update the existing relevant page
               - Place it in `wiki/technical/` or `wiki/world/` as appropriate (and update `wiki/overview.md` only when it materially changes)
               - Do NOT add a Dean-Relevance section to public wiki pages (see CLAUDE.md)
            5. Update CHANGELOG.md with a dated entry listing created, updated, and skipped items.
            6. Do NOT regenerate INDEX.md — that runs weekly.
            7. Do NOT touch any files in private/ — read only (including relevance files).
            8. Do NOT run git commands — a later workflow step opens a PR with your file edits.

            Follow all guidelines in CLAUDE.md exactly.

      # Direct push to main (re-enable when ready to auto-merge nightly runs)
      # - name: Commit and push wiki changes
      #   id: commit
      #   run: |
      #     git config user.name "github-actions[bot]"
      #     git config user.email "github-actions[bot]@users.noreply.github.com"
      #     git add wiki/ CHANGELOG.md
      #     BEFORE_SHA="${{ steps.before.outputs.sha }}"
      #     if ! git diff --staged --quiet; then
      #       git commit -m "Nightly wiki update $(date -u +%F)"
      #     fi
      #     if [ "$(git rev-parse HEAD)" != "$BEFORE_SHA" ]; then
      #       git push
      #       echo "committed=true" >> "$GITHUB_OUTPUT"
      #     else
      #       echo "committed=false" >> "$GITHUB_OUTPUT"
      #       echo "No wiki changes to commit"
      #     fi

      - name: Open PR with wiki changes
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add wiki/ CHANGELOG.md
          if git diff --staged --quiet; then
            echo "committed=false" >> "$GITHUB_OUTPUT"
            echo "No wiki changes to commit"
            exit 0
          fi
          BRANCH="nightly/$(date -u +%F)-${{ github.run_id }}"
          git checkout -b "$BRANCH"
          git commit -m "Nightly wiki update $(date -u +%F)"
          git push -u origin "$BRANCH"
          PR_URL=$(gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Nightly wiki update $(date -u +%F)" \
            --body "Automated nightly wiki update. Review and merge when ready.")
          echo "committed=true" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
          echo "Opened PR: $PR_URL"

      - name: Write run summary
        if: always()
        run: |
          echo "## Nightly Wiki Run — $(date '+%Y-%m-%d')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Ingestion" >> $GITHUB_STEP_SUMMARY
          cat private/sources/staging/.run-summary >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "No summary written" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Wiki Changes" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.commit.outputs.committed }}" = "true" ]; then
            echo "Branch: \`${{ steps.commit.outputs.branch }}\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "PR: ${{ steps.commit.outputs.pr_url }}" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            git diff --name-only "${{ steps.before.outputs.sha }}" HEAD >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "No PR opened (nothing scored high enough, or no file edits)." >> $GITHUB_STEP_SUMMARY
          fi
